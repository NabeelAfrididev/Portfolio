<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="index2.css">

    <title>Hashir's Project</title>

</head>

<body>
    <header>
        <div class="header">
            <div class="navbar navbar-extend-lg  ">
                <h2><a class="main-hd-game" href="handcricket.html">Hand Cricket</a></h2>
                <h2><button class="main-hd-game rule-hd-game">Game Rules <i class="fa-regular fa-comments"></i></button>
                </h2>

            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 class="text-center mt-4 color-change">Do You Wanna Play?</h2>
                    <div class="row mt-5 text-center">
                        <div class="col-4">
                            <p class="hd-normal">Player</p>
                            <img class="game-image" src="emoji start.png" alt="">
                            <br>
                            <div class="placeholder-score"></div>
                            <p class="hd-normal">Player Score</p>
                        </div>
                        <div class="col-4 ">
                            <div class="dropdown">
                                <button class="toss-btn btn"> Toss </button>
                                <div class="dropdown-content">
                                    <p>Heads</p>
                                    <p>Tails</p>
                                </div>
                            </div>
                            <br>
                            <div class="dropdown">
                            <button class="playing-btn btn">Play </button>
                                <div class="dropdown-content">
                                    <p>1</p>
                                    <p>2</p>
                                    <p>3</p>
                                    <p>4</p>
                                    <p>5</p>
                                    <p>6</p>
                                </div>
                           </div>
                            <br>
                            <div class="placeholder-update">Choose The Toss</div>
                        </div>
                        <div class="col-4">
                            <p class="hd-normal">Computer</p>
                            <img class="game-image" src="emoji start.png" alt="">
                            <br>
                            <div class="placeholder-score"></div>
                            <p class="hd-normal">Computer Score</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- <script src="handcricket.js"></script> -->
</body>

</html>
