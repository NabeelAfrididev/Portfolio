<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="handcricket.css">

    <title>Hashir's Project</title>

</head>

<body>
    <header>
        <div class="header">
            <div class="navbar navbar-extend-lg  ">
                <h2 class="main-hd-game"><a href="handcricket.html">Hand Cricket</a></h2>
                <h2 class="rule-hd-game"><button>Game Rules</button></h2>
            </div>
        </div>
    </header>
    <main>
        <h2 class="game-name mt-3">Do You Wanna Play?</h2>
        <div class="container-fluid">
            <div class="container">
                <div class="row d-flex justify-content-between">
                    <div class="col-sm-6 mt-5 p-2 text-center">
                        <h3>Player</h3>
                        <div class="img">
                            <img id="emoji-start" src="emoji start.png" alt="">
                            <img id="emoji1" src="emoji 1 1.png" alt="">
                            <img id="emoji2" src="emoji 1 2.png" alt="">
                            <img id="emoji3" src="emoji 1 3.jpg" alt="">
                            <img id="emoji4" src="emoji 1 4.png" alt="">
                            <img id="emoji5" src="emoji 1 5.jpg" alt="">
                            <img id="emoji6" src="emoji 1 6.png" alt="">
                        </div>
                        <input id="user-score" type="number" placeholder="">
                        <h4>Player Score</h4>
                        <div class="dropdown">
                            <button class=" game-btn btn  dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Play
                            </button>

                            <ul class="dropdown-menu">
                                <li><button class="dropdown-item">1</button></li>
                                <li><button class="dropdown-item">2</button></li>
                                <li><button class="dropdown-item">3</button></li>
                                <li><button class="dropdown-item">4</button></li>
                                <li><button class="dropdown-item">5</button></li>
                                <li><button class="dropdown-item">6</button></li>
                            </ul>
                        </div>
                    </div>

                    <div class="col-sm-5 mt-5 p-2 text-center">
                        <h3>Computer</h3>
                        <div class="img2">
                            <img id="emoji-start" src="emoji start.png" alt="">
                            <img id="emoji1" src="emoji 1 1.png" alt="">
                            <img id="emoji2" src="emoji 1 2.png" alt="">
                            <img id="emoji3" src="emoji 1 3.jpg" alt="">
                            <img id="emoji4" src="emoji 1 4.png" alt="">
                            <img id="emoji5" src="emoji 1 5.jpg" alt="">
                            <img id="emoji6" src="emoji 1 6.png" alt="">
                        </div>
                        <input type="number" placeholder="">
                        <h4>Computer Score</h4>
                       
                    </div>
                </div>
            </div>
        </div>
    </main>
  <input type="text" name="" id="update-place">
    <div class="dropdown-toss">
        <button class=" game-btn dropdown-toggle" type="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            Choose Toss
        </button>

        <ul class="dropdown-menu">
            <li><button class="dropdown-item">Head</button></li>
            <li><button class="dropdown-item">Tails</button></li>
        </ul>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
    <script src="handcricket.js"></script>
</body>

</html>
